name: Staging synk

on:
    workflow_dispatch:
        inputs:
            environment:
                description: 'staging'
                required: true
                default: 'staging'
                type: choice
                options:
                - staging

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v4
            - name: Terraform staging
              working-directory: modules
              run: terraform init && terraform apply -auto-approve